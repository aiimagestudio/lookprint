<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lookprint</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="sprocket" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <div class="logo">LP</div>
      <div>
        <h1>Lookprint</h1>
        <p class="tag" id="projectTag" data-i18n="tagline">视觉风格指纹</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="active" data-i18n="nav_overview">概览</button>
      <button data-tab="review" data-i18n="nav_review">离群筛选</button>
      <button data-tab="scan" data-i18n="nav_scan">候选扫描</button>
      <button data-tab="settings" data-i18n="nav_settings">项目</button>
    </nav>
    <div class="lang-wrap">
      <button id="langBtn" class="ghost lang-btn">中文</button>
      <div class="lang-menu" id="langMenu" hidden></div>
    </div>
    <div class="job" id="jobBar" hidden>
      <span id="jobText"></span>
      <div class="bar"><i id="jobFill"></i></div>
    </div>
  </header>

  <main>
    <section id="view-overview" class="view active">
      <div class="hero-stats" id="heroStats"></div>
      <div class="empty-guide" id="emptyGuide" hidden></div>
      <div class="split">
        <div>
          <h2><span data-i18n="typical9">典型 9 张</span> <small data-i18n="typical9_sub">离集合中心最近</small></h2>
          <div class="grid three" id="typicalGrid"></div>
        </div>
        <div>
          <h2><span data-i18n="farthest9">最远 9 张</span> <small data-i18n="farthest9_sub">先看这些</small></h2>
          <div class="grid three" id="outlierPreview"></div>
        </div>
      </div>
      <h2 data-i18n="hists">色阶与示波器</h2>
      <div class="plots" id="plots"></div>
      <h2 data-i18n="light_sat">光影 × 饱和</h2>
      <div class="chart-wrap"><canvas id="scatterChart"></canvas></div>
    </section>

    <section id="view-review" class="view">
      <div class="toolbar">
        <label><span data-i18n="cut">距离阈值</span>
          <input type="range" id="dSlider" min="3" max="14" step="0.05" />
          <b id="dValue">—</b>
        </label>
        <span id="reviewCount" class="pill"></span>
        <div class="chips" id="decisionFilter">
          <button data-f="" class="active" data-i18n="f_all">全部</button>
          <button data-f="open" data-i18n="f_open">未标</button>
          <button data-f="keep" data-i18n="f_keep">保留</button>
          <button data-f="maybe" data-i18n="f_maybe">待定</button>
          <button data-f="drop" data-i18n="f_drop">剔除</button>
        </div>
        <button class="primary" id="exportRemaining" data-i18n="export_remaining">导出清理后剩余…</button>
        <button class="ghost" id="exportDropped" data-i18n="export_dropped">导出已剔除…</button>
      </div>
      <p class="hint" id="reviewHint" data-i18n="review_hint"></p>
      <div class="grid cards" id="reviewGrid"></div>
    </section>

    <section id="view-scan" class="view">
      <div class="toolbar">
        <input type="text" id="scanFolder" data-i18n-ph="scan_ph" spellcheck="false" />
        <button id="browseBtn" type="button" data-i18n="browse">选择文件夹</button>
        <label class="check"><input type="checkbox" id="scanRecursive" /><span data-i18n="recursive">含子文件夹</span></label>
        <button class="primary" id="scanBtn" data-i18n="scan_btn">扫描</button>
        <span id="scanSummary" class="pill"></span>
      </div>
      <div class="toolbar">
        <div class="chips" id="scanFilter">
          <button data-f="pass" class="active" data-i18n="f_pass">符合</button>
          <button data-f="review" data-i18n="f_review">需复核</button>
          <button data-f="marked" data-i18n="f_marked">已标记</button>
          <button data-f="all" data-i18n="f_all">全部</button>
        </div>
        <button class="ghost" id="markPass" data-i18n="mark_pass">标记当前符合项</button>
        <button class="primary" id="exportMarked" data-i18n="export_marked">复制已标记到文件夹…</button>
      </div>
      <div class="grid cards" id="scanGrid"></div>
    </section>

    <section id="view-settings" class="view">
      <div class="panel">
        <h2 data-i18n="gold_title">金标准数据集</h2>
        <p class="hint" data-i18n="gold_desc"></p>
        <label><span data-i18n="project_name">项目名</span> <input id="projName" /></label>
        <label><span data-i18n="gold_path">金标准路径</span>
          <div class="row">
            <input id="goldPath" spellcheck="false" />
            <button id="browseGold" type="button" data-i18n="browse">选择文件夹</button>
          </div>
        </label>
        <label><span data-i18n="percentile">离群分位（默认 90）</span>
          <input id="percentile" type="number" min="50" max="99.5" step="0.5" />
        </label>
        <div class="row">
          <button class="primary" id="saveProject" data-i18n="save">保存</button>
          <button id="reanalyze" data-i18n="reanalyze">重新分析金标准</button>
        </div>
        <p class="hint" id="settingsStatus"></p>
      </div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" id="lbClose">×</button>
    <button class="lb-nav prev" id="lbPrev">‹</button>
    <img id="lbImg" alt="" />
    <button class="lb-nav next" id="lbNext">›</button>
    <div class="lb-meta">
      <div>
        <strong id="lbName"></strong>
        <span id="lbDist"></span>
        <div class="flags" id="lbFlags"></div>
      </div>
      <div class="lb-actions" id="lbActions"></div>
    </div>
  </div>

  <div id="folderModal" class="modal" hidden>
    <div class="modal-card">
      <header>
        <strong id="fmTitle">选择文件夹</strong>
        <button class="ghost" id="fmClose" data-i18n="close">关闭</button>
      </header>
      <div class="crumb" id="fmPath"></div>
      <div class="fm-list" id="fmList"></div>
      <footer>
        <span id="fmInfo"></span>
        <button class="primary" id="fmPick">使用此文件夹</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
